<style>

.navbar{grid-area:navbar;background:#001927;display:flex;align-items:center;justify-content:space-between;padding:12px;height:64px}.navbar-logo{display:flex;align-items:center;height:40px}.navbar-logo-img{height:40px;width:auto;display:block;flex-shrink:0}.navbar-secondary,.navbar-icons,.account-menu{display:flex;align-items:center;gap:8px}.navbar-icon-btn,.sidebar-item-inner{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:#fff;position:relative}.badge-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;background:#e60f57;border-radius:50%}.navbar-divider{width:1px;height:32px;background:rgba(255,255,255,.15)}.account-avatar{width:24px;height:24px;border-radius:8px;background:#00f2c9;color:#002233;font:var(--text-xs);font-weight:700;display:flex;align-items:center;justify-content:center}.account-name{color:#fff;font-size:14px;font-weight:700}

.deal{display:flex;flex-direction:column;min-height:100%}.deal-header{display:flex;flex-direction:column;gap:12px;padding:40px 0 0;margin-bottom:40px}.deal-header__main{display:flex;align-items:flex-start;gap:16px;flex-wrap:nowrap}.deal-header__title{flex:1;min-width:0;padding-top:2px;font:700 28px/1.3 var(--font);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.deal-tags{display:flex;flex-wrap:wrap;gap:8px;padding-left:56px}.deal-tag{display:inline-flex;align-items:center;height:24px;padding:4px 8px;border-radius:4px;background:#eceeef;font:900 12px/1.3 var(--font);text-transform:uppercase}.deal-tag--cyan{background:#00dbff}

    .toast__description{font:var(--text-sm)}

<script>
const DEAL={name:'Projeto MRV - Mário e Tarsila',owner:'Flávia',actor:'Luiza Jung'};const STATUS={ativo:{label:'Copiar link de pagamento',icon:'content_copy'},inativo:{label:'Pagamento inativo',icon:'info'},concluido:{label:'Pagamento concluído',icon:'check_circle'}};const PREV=['concluido','inativo'];const fmtTotal=function(c){return c?fmt(c):'R$ 00,00'};const fmtDt=function(d){return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const parse=v=>Number.parseInt((v||'').replace(/\D/g,''),10)||0;const fmtIn=c=>c?(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';const uid=()=>crypto.randomUUID();const state={links:[],drawer:'closed',active:null,toast:null,pendingSuccess:false,totalOpen:false,draft:emptyDraft(),tab:'Histórico'};let toastTimer;function emptyDraft(){return{name:DEAL.name,description:'',total:0,specify:false,items:[{id:uid(),name:'',unit:0,qty:1}]}}function total(){return state.draft.specify?state.draft.items.reduce(function(s,i){return s+i.unit*i.qty;},0):state.draft.total}function canCreate(){var d=state.draft;if(!d.name.trim()||!d.description.trim())return false;if(!d.specify)return d.total>0;return d.items.every(function(i){return i.name.trim()&&i.unit>0&&i.qty>0})}function icon(name,size){size=size||24;return '<span class="icon" style="width:'+size+'px;height:'+size+'px;font-size:'+size+'px">'+name+'</span>'}function chevron(up){return '<span class="chevron'+(up?' is-up':'')+'" aria-hidden="true"></span>'}function btn(kind,label,opts){opts=opts||{};var dis=opts.disabled?'disabled':'';var ic=opts.icon?icon(opts.icon):'';return '<button class="tg-button tg-button--'+kind+(opts.iconOnly?' tg-button--icon':'')+'" data-act="'+(opts.act||'')+'" '+(opts.id?'data-id="'+opts.id+'" ':'')+dis+' '+(opts.aria?'aria-label="'+opts.aria+'"':'')+'>'+ic+(opts.iconOnly?'':label)+'</button>'}function field(label,id,val,opts){opts=opts||{};return '<label class="tg-field"><span class="tg-field__label">'+label+(opts.req?'<span class="tg-field__req">*</span>':'')+'</span><span class="tg-input'+(opts.disabled?' is-disabled':'')+'">'+(opts.prefix?'<span>'+opts.prefix+'</span>':'')+'<input id="'+id+'" value="'+(val||'')+'" placeholder="'+(opts.ph||'')+'" '+(opts.disabled?'disabled':'')+'></span></label>'}function pill(status,id){var meta=STATUS[status];var cls='pay-pill pay-pill--'+status;var body=icon(meta.icon,16)+meta.label;if(status==='ativo'&&id) return '<button type="button" class="'+cls+'" data-act="copy-link" data-id="'+id+'">'+body+'</button>';return '<span class="'+cls+'">'+body+'</span>'}function showToast(toast){clearTimeout(toastTimer);state.toast=toast;toastTimer=setTimeout(function(){state.toast=null;render()},6000)}function render(){var d=state.draft,t=total(),links=state.links;var hist=[{kind:'dot',html:'<strong>Flávia</strong> alterou o responsável para Flávia',at:'23/07/2026 17:18'},{kind:'flag',html:'<strong>Negociação criada</strong>',at:'23/07/2026 17:15'}];hist=links.map(function(l){return {kind:'dot',html:'<strong>'+DEAL.actor+'</strong> criou um link de pagamento no valor de '+fmt(l.total),at:fmtDt(l.created),status:l.status,id:l.id}}).concat(hist);var payBody=links.length?'<ul class="pay-list">'+links.map(function(l){return '<li class="pay-row"><button class="pay-row__open" data-act="open" data-id="'+l.id+'"><span class="pay-row__prefix"><time>'+fmtDt(l.created)+'</time><span>'+fmt(l.total)+'</span></span></button>'+pill(l.status,l.id)+'</li>'}).join('')+'</ul>':'<p class="pay-empty">Não há links de pagamentos na negociação, clique no botão abaixo para criar um link</p>';var funnel=['past','past','current','next','next','next'].map(function(tone,i){return '<li class="funnel-step funnel-step--'+tone+(i===0?' is-first':'')+(i===5?' is-last':'')+'">'+(i>0?'<span class="funnel-step__tale"></span>':'')+'<span class="funnel-step__info"><strong>Etapa</strong> <span>(0 dias)</span></span>'+(i<5?'<span class="funnel-step__nose"></span>':'')+'</li>'}).join('');var tabs=['Histórico','Email','Tarefas','Questionário','Produtos e serviços','Proposta','Arquivos'];var items='';if(d.specify){items='<section><div class="items-head"><h3>Produtos e serviços do link</h3>'+btn('tertiary','Adicionar novo item',{icon:'add',act:'add-item'})+'</div>'+d.items.map(function(i){return '<article class="item-card"><div class="item-card__fields">'+field('Nome','n-'+i.id,i.name,{req:true,ph:'Insira o nome do item'})+'<div class="item-card__row">'+field('Preço unitário','p-'+i.id,fmtIn(i.unit),{req:true,prefix:'R$',ph:'00,00'})+'<label class="tg-field"><span class="tg-field__label">Quantidade<span class="tg-field__req">*</span></span><span class="tg-input"><select id="q-'+i.id+'">'+Array.from({length:20},function(_,k){return '<option '+(i.qty===k+1?'selected':'')+'>'+(k+1)+'</option>'}).join('')+'</select></span></label></div></div>'+btn('neutral','',{icon:'delete',iconOnly:true,act:'del-item',id:i.id,disabled:d.items.length===1,aria:'Excluir item'})+'</article>'}).join('')+'</section>';}var create='<div class="drawer-body"><div class="drawer-form">'+field('Nome','name',d.name,{req:true})+field('Descrição','desc',d.description,{req:true,ph:'Insira a descrição do pagamento'})+'<div>'+field('Valor total','val',d.specify?fmtIn(t):fmtIn(d.total),{req:true,prefix:d.specify?'':'R$',ph:d.specify?'Cadastre os itens para obter a soma total':'00,00',disabled:d.specify})+'<div style="margin-top:8px"><button class="tg-switch'+(d.specify?' is-on':'')+'" data-act="toggle" role="switch"><span class="tg-switch__track"></span>Especificar itens</button></div></div>'+items+'</div><button type="button" class="total-card'+ (state.totalOpen?' is-open':'') + '" data-act="toggle-total"><div class="total-card__head"><strong>Total</strong><span>'+fmtTotal(t)+'</span>'+chevron(!state.totalOpen)+'</div>'+(state.totalOpen?'<div class="total-card__body"><span class="total-card__divider"></span><ul class="total-card__items">'+(d.specify?d.items:[{name:d.description||'Valor do link',qty:1,unit:t}]).map(function(i){return '<li><span>'+(i.name||'Item sem nome')+'</span><span>'+i.qty+'x '+fmt(i.unit)+'</span></li>'}).join('')+'</ul></div>':'')+'</button></div><footer class="drawer-actions"><div class="tg-group">'+btn('secondary','Cancelar',{act:'close'})+btn('primary','Criar link',{act:'create',disabled:!canCreate()})+'</div></footer>';var a=state.active;var ready=a?('<div class="drawer-body"><div class="ready-stack"><aside class="tg-message"><div class="tg-message__body">'+icon('info')+'<div><p class="tg-message__title">Configurações de pagamento</p><p>Métodos de pagamento aceitos, validade do link e número de parcelas são determinados por Administradores na TOTVSPay.</p></div></div></aside><section class="ready-card"><h3 class="ready-title">'+icon('check_circle')+' Link de pagamento pronto!</h3><div><strong>Nome</strong><p>'+a.name+'</p></div><div><strong>Descrição</strong><p style="color:#405466">'+a.description+'</p></div><div class="ready-grid"><div><strong>Valor total</strong><p>'+fmt(a.total)+'</p></div><div><strong>Data de criação</strong><p>'+a.created.toLocaleDateString('pt-BR')+'</p></div><div><strong>Data de expiração</strong><p>'+a.expires.toLocaleDateString('pt-BR')+'</p></div></div><div class="ready-link">'+field('Link','url',a.url,{disabled:true})+btn('secondary','',{icon:'content_copy',iconOnly:true,act:'copy',aria:'Copiar link'})+'</div><div class="ready-items"><strong>Itens no link</strong>'+a.items.map(function(i){return '<div class="ready-item"><span>'+i.name+'</span><span>'+i.qty+'x '+fmt(i.unit)+'</span></div>'}).join('')+'</div></section></div></div><footer class="drawer-actions"><div class="tg-group">'+btn('secondary','Fechar',{act:'close'})+btn('primary','Copiar link',{act:'copy'})+'</div></footer>'):'';var drawer=state.drawer==='closed'?'':'<button class="drawer-scrim" data-act="close" aria-label="Fechar"></button><aside class="drawer" role="dialog"><header class="drawer-header"><h2>Link de pagamento</h2>'+btn('neutral','',{icon:'close',iconOnly:true,act:'close',aria:'Fechar'})+'</header>'+(state.drawer==='create'?create:ready)+'</aside>';document.getElementById('app').innerHTML='<div class="deal"><header class="deal-header"><div class="deal-header__main">'+btn('neutral','',{icon:'arrow_back',iconOnly:true,aria:'Voltar'})+'<h1 class="deal-header__title">'+DEAL.name+'</h1><div class="tg-group">'+btn('neutral','',{icon:'more_vert',iconOnly:true,aria:'Mais ações'})+btn('secondary','Marcar perda',{icon:'thumb_down'})+btn('primary','Marcar venda',{icon:'thumb_up'})+'</div></div><div class="deal-tags"><span class="deal-tag deal-tag--cyan">EM ANDAMENTO</span><span class="deal-tag">FECHAMENTO E FEEDBACK</span><span class="deal-tag deal-tag--cyan">VENDA CERTA!</span></div></header><ol class="funnel">'+funnel+'</ol><div class="deal-grid"><div class="deal-aside"><aside class="deal-panel">'+['Negociação','Contatos','Empresa','Responsável'].map(function(n){return '<section class="deal-acc"><div class="deal-acc__head"><span class="deal-acc__title">'+n+'</span>'+icon('expand_more')+'</div></section>'}).join('')+'</aside><section class="pay-block"><div class="deal-acc__head"><h2 class="deal-acc__title">Pagamentos</h2>'+(links.length?'<span class="pay-badge">'+links.length+'</span>':'')+icon('expand_less')+'</div>'+payBody+btn('secondary','Criar link de pagamento',{icon:'add',act:'open-create'})+(links.length?btn('tertiary','Ver histórico de pagamentos',{act:'history'}):'')+'</section></div><section><div class="deal-tabs">'+tabs.map(function(n){return '<button class="deal-tab'+(state.tab===n?' is-active':'')+'" data-tab="'+n+'">'+n+'</button>'}).join('')+'</div><div class="deal-toolbar"><div class="deal-filters"><label class="deal-filter">Do<span class="tg-input"><select><option>RD Station CRM</option></select></span></label><label class="deal-filter">Exibir<span class="tg-input"><select><option>Todos os eventos</option></select></span></label></div>'+btn('secondary','Criar anotação',{icon:'add'})+'</div><div>'+hist.map(function(e,i){return '<article class="timeline-item"><div class="timeline-rail">'+(e.kind==='flag'?'<span class="timeline-flag">'+icon('flag',24)+'</span>':'<span class="timeline-dot"></span>')+(i<hist.length-1?'<span class="timeline-line"></span>':'')+'</div><div class="timeline-content"><p>'+e.html+'</p><div class="timeline-meta"><time>'+e.at+'</time>'+(e.status?pill(e.status,e.id):'')+'</div></div></article>'}).join('')+'</div></section></div>'+drawer+(state.toast&&state.drawer==='closed'?'<div class="toast" role="status"><span class="toast__icon">'+icon('check_circle')+'</span><div class="toast__content"><p class="toast__title">'+state.toast.title+'</p>'+(state.toast.description?'<p class="toast__description">'+state.toast.description+'</p>':'')+'</div>'+btn('neutral','',{icon:'close',iconOnly:true,act:'dismiss-toast',aria:'Fechar aviso'})+'</div>':'')+'</div>';bind();}function bind(){document.querySelectorAll('[data-act]').forEach(function(el){el.onclick=function(ev){ev.stopPropagation();act(el.dataset.act,el.dataset.id)}});document.querySelectorAll('[data-tab]').forEach(function(el){el.onclick=function(){state.tab=el.dataset.tab;render()}});var name=document.getElementById('name'); if(name) name.oninput=function(e){state.draft.name=e.target.value;refreshCreate()};var desc=document.getElementById('desc'); if(desc) desc.oninput=function(e){state.draft.description=e.target.value;refreshCreate()};var val=document.getElementById('val'); if(val&&!state.draft.specify) val.oninput=function(e){state.draft.total=parse(e.target.value);refreshCreate()};state.draft.items.forEach(function(i){var n=document.getElementById('n-'+i.id); if(n) n.oninput=function(e){i.name=e.target.value;refreshCreate()};var p=document.getElementById('p-'+i.id); if(p) p.oninput=function(e){i.unit=parse(e.target.value);refreshCreate()};var q=document.getElementById('q-'+i.id); if(q) q.onchange=function(e){i.qty=Number(e.target.value);render()}});}function refreshCreate(){var b=document.querySelector('[data-act=create]'); if(b) b.disabled=!canCreate(); var totalEl=document.querySelector('.total-card__head span'); if(totalEl) totalEl.textContent=fmtTotal(total());}function act(a,id){if(a==='open-create'){state.draft=emptyDraft();state.totalOpen=false;state.drawer='create';state.active=null;render()}if(a==='toggle-total'){state.totalOpen=!state.totalOpen;render()}if(a==='history'){state.tab='Histórico';render()}if(a==='dismiss-toast'){clearTimeout(toastTimer);state.toast=null;render()}if(a==='close'){state.drawer='closed';if(state.pendingSuccess){state.pendingSuccess=false;showToast({title:'Link criado com sucesso',description:'A partir de agora você já consegue receber pagamentos através desse link'});}render()}if(a==='toggle'){state.draft.specify=!state.draft.specify;render()}if(a==='add-item'){state.draft.items.push({id:uid(),name:'',unit:0,qty:1});render()}if(a==='del-item'&&state.draft.items.length>1){state.draft.items=state.draft.items.filter(function(i){return i.id!==id});render()}if(a==='create'&&canCreate()){var now=new Date(); var t=total();var items=state.draft.specify?state.draft.items:[{id:uid(),name:state.draft.description,unit:t,qty:1}];var link={id:uid(),name:state.draft.name,description:state.draft.description,total:t,items:items,url:'https://link.malga.io/'+uid(),created:now,expires:new Date(now.getTime()+31*86400000),status:'ativo'};state.links=state.links.map(function(l,i){return Object.assign({},l,{status:PREV[i%PREV.length]})});state.links.unshift(link); state.active=link; state.drawer='ready';state.pendingSuccess=true;render()}if(a==='open'){state.active=state.links.find(function(l){return l.id===id});state.drawer='ready';render()}if(a==='copy'&&state.active){navigator.clipboard.writeText(state.active.url).catch(function(){});showToast({title:'Link copiado',description:'O link de pagamento está na área de transferência'});render()}if(a==='copy-link'){var found=state.links.find(function(x){return x.id===id}); if(found){navigator.clipboard.writeText(found.url).catch(function(){});showToast({title:'Link copiado',description:'O link de pagamento está na área de transferência'});render()}}}render();
</script>
