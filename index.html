<style>
:root{--font:'DM Sans',sans-serif;--font-crm:'Nunito Sans','DM Sans',sans-serif;--text-lg:500 20px/30px var(--font);--text-lg-bold:700 20px/30px var(--font);--text-md:500 16px/24px var(--font);--text-md-bold:700 16px/24px var(--font);--text-sm:500 14px/20px var(--font);--text-sm-bold:700 14px/20px var(--font);--text-xs:500 12px/16px var(--font);--shadow-xs:0 2px 6px rgba(0,34,51,.1);--shadow-md:0 8px 18px rgba(0,34,51,.16)}

.tg-field{display:flex;flex-direction:column;gap:8px;width:100%}.tg-field__label{display:flex;gap:4px;font:var(--text-md-bold)}.tg-field__req{color:#c20046}.tg-input{display:flex;align-items:center;gap:8px;height:40px;padding:8px 12px;border:1px solid #b2bcc1;border-radius:12px;background:#fff}.tg-input input,.tg-input select{flex:1;min-width:0;border:0;background:transparent;font:var(--text-md);outline:none}.tg-input.is-disabled{background:#edeff1;color:#7f8d99}.tg-switch{display:inline-flex;align-items:center;gap:12px;font:var(--text-md)}.tg-switch__track{width:48px;height:24px;border-radius:999px;background:#b2bcc1;position:relative}.tg-switch__track::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-xs)}.tg-switch.is-on .tg-switch__track{background:#00dbff}.tg-switch.is-on .tg-switch__track::after{transform:translateX(24px)}.tg-message{display:flex;border-radius:8px;border-left:8px solid #00dbff;overflow:hidden}.tg-message__body{display:flex;gap:16px;flex:1;padding:12px 16px;border:1px solid #d6dbde;border-left:0;border-radius:0 8px 8px 0}.tg-group{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.deal{display:flex;flex-direction:column;min-height:100%}.deal-header{display:flex;flex-direction:column;gap:12px;padding:40px 0 0}.deal-header__main{display:flex;align-items:flex-start;gap:16px}.deal-header__title{flex:1;padding-top:2px;font:700 28px/1.3 var(--font)}.deal-tags{display:flex;flex-wrap:wrap;gap:8px;padding-left:56px}.deal-tag{display:inline-flex;align-items:center;height:24px;padding:4px 8px;border-radius:4px;background:#eceeef;font:900 12px/1.3 var(--font);text-transform:uppercase}.deal-tag--cyan{background:#00dbff}
.funnel{display:flex;list-style:none;padding:0 0 24px}.funnel-step{flex:1;display:flex;align-items:stretch;height:32px;min-width:0}.funnel-step__info{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;padding:6px 8px;font:var(--text-sm)}.funnel-step__info strong{font:var(--text-sm-bold)}.funnel-step__nose,.funnel-step__tale{width:6px;height:32px;flex-shrink:0}.funnel-step__nose{clip-path:polygon(0 0,100% 50%,0 100%)}.funnel-step__tale{clip-path:polygon(100% 0,100% 100%,0 50%)}.funnel-step.is-first .funnel-step__info{border-radius:8px 0 0 8px}.funnel-step.is-last .funnel-step__info{border-radius:0 8px 8px 0}.funnel-step--past .funnel-step__info,.funnel-step--past .funnel-step__nose,.funnel-step--past .funnel-step__tale{background:#b2f4ff}.funnel-step--current .funnel-step__info,.funnel-step--current .funnel-step__nose,.funnel-step--current .funnel-step__tale{background:#00dbff}.funnel-step--next .funnel-step__info,.funnel-step--next .funnel-step__nose,.funnel-step--next .funnel-step__tale{background:#eceeef}
.deal-grid{display:grid;grid-template-columns:412px minmax(0,1fr);gap:24px;align-items:start}.deal-aside{display:flex;flex-direction:column;gap:16px}.deal-panel{background:#eceeef;border:1px solid #d6dbde;border-radius:8px;overflow:hidden}.deal-acc{border-bottom:1px solid #d6dbde}.deal-acc:last-child{border-bottom:0}.deal-acc__head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:24px;text-align:left;background:#eceeef}.deal-acc__title{font-family:var(--font-crm);font-size:20px;font-weight:700;line-height:30px}
.deal-tabs{display:flex;border-bottom:1px solid #d6dbde;overflow:auto}.deal-tab{padding:8px 16px 16px;font:var(--text-md-bold);color:#405466;white-space:nowrap;box-shadow:inset 0 -1px 0 #d6dbde}.deal-tab:first-child{padding-left:0}.deal-tab.is-active{color:#0077b2;box-shadow:inset 0 -4px 0 #00dbff}.deal-toolbar{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;margin-top:32px}.deal-filters{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.deal-filter{display:flex;align-items:center;gap:12px;font-family:var(--font-crm);font-weight:700}.deal-filter .tg-input{min-width:168px}
.timeline-item{display:grid;grid-template-columns:40px 1fr;gap:12px}.timeline-rail{display:flex;flex-direction:column;align-items:center;padding-top:4px}.timeline-dot{width:16px;height:16px;border-radius:50%;border:4px solid #6e00c5;background:#fff;flex-shrink:0}.timeline-flag{width:40px;height:40px;border-radius:50%;background:#e60f57;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}.timeline-line{width:4px;flex:1;min-height:24px;background:#d6dbde;border-radius:999px}.timeline-content{padding-bottom:32px}.timeline-content time{display:block;margin-top:8px}
.pay-block{background:#eceeef;border-radius:8px;padding:24px 16px;display:flex;flex-direction:column;gap:16px}.pay-block .deal-acc__head{padding:0 8px}.pay-empty{padding:0 10px;font-family:var(--font-crm)}.pay-list{display:flex;flex-direction:column;gap:12px}.pay-row{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left}.pay-pill{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 12px 0 8px;border-radius:999px;background:#b2f4ff;color:#0077b2;font:var(--text-xs);font-weight:700}
.drawer-scrim{position:fixed;inset:0;background:rgba(0,34,51,.4);z-index:1020}.drawer{position:fixed;top:0;right:0;height:100vh;width:min(600px,100%);background:#fff;box-shadow:var(--shadow-md);z-index:1030;display:flex;flex-direction:column}.drawer-header{display:flex;gap:24px;padding:24px;border-bottom:1px solid #d6dbde}.drawer-header h2{flex:1;padding-top:4px;font:var(--text-lg-bold)}.drawer-body{flex:1;min-height:0;overflow:auto;padding:8px 12px;display:flex;flex-direction:column}.drawer-form{display:flex;flex-direction:column;gap:24px;padding:24px 12px;flex:1}.drawer-actions{display:flex;justify-content:flex-end;padding:24px;border-top:1px solid #d6dbde}.total-bar{margin-top:auto;display:flex;align-items:center;gap:12px;padding:12px 24px;border:1px solid #b2bcc1;border-radius:16px;box-shadow:var(--shadow-xs)}.total-bar strong{flex:1;font:var(--text-lg-bold)}.items-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #d6dbde}.item-card{display:flex;gap:8px;padding:24px 16px 24px 32px;border:1px solid #d6dbde;border-radius:16px;margin-top:12px}.item-card__fields{flex:1;display:flex;flex-direction:column;gap:22px}.item-card__row{display:grid;grid-template-columns:1fr 1fr;gap:22px}.ready-stack{display:flex;flex-direction:column;gap:16px;padding:24px 12px}.ready-card{display:flex;flex-direction:column;gap:8px;padding:24px;border:1px solid #d6dbde;border-radius:16px}.ready-title{display:flex;align-items:center;gap:8px;font:var(--text-lg-bold)}.ready-title .icon{color:#087a3a}.ready-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.ready-link{display:flex;gap:16px;align-items:flex-end}.ready-items{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid #d6dbde}.ready-item{display:flex;justify-content:space-between;gap:16px}.toast{position:fixed;right:24px;bottom:24px;z-index:1050;background:#002233;color:#fff;padding:12px 16px;border-radius:12px;font:var(--text-sm-bold)}

<script>
const DEAL={name:'Projeto MRV - Mário e Tarsila',owner:'Flávia'};const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const parse=v=>Number.parseInt((v||'').replace(/\D/g,''),10)||0;const fmtIn=c=>c?(c/100).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'';const uid=()=>crypto.randomUUID();const state={links:[],drawer:'closed',active:null,toast:null,draft:emptyDraft(),tab:'Histórico'};function emptyDraft(){return{name:DEAL.name,description:'',total:0,specify:false,items:[{id:uid(),name:'',unit:0,qty:1}]}}function total(){return state.draft.specify?state.draft.items.reduce(function(s,i){return s+i.unit*i.qty;},0):state.draft.total}function canCreate(){var d=state.draft;if(!d.name.trim()||!d.description.trim())return false;if(!d.specify)return d.total>0;return d.items.every(function(i){return i.name.trim()&&i.unit>0&&i.qty>0})}function icon(name,size){size=size||24;return '<span class="icon" style="width:'+size+'px;height:'+size+'px;font-size:'+size+'px">'+name+'</span>'}function btn(kind,label,opts){opts=opts||{};var dis=opts.disabled?'disabled':'';var ic=opts.icon?icon(opts.icon):'';return '<button class="tg-button tg-button--'+kind+(opts.iconOnly?' tg-button--icon':'')+'" data-act="'+(opts.act||'')+'" '+dis+' '+(opts.aria?'aria-label="'+opts.aria+'"':'')+'>'+ic+(opts.iconOnly?'':label)+'</button>'}function field(label,id,val,opts){opts=opts||{};return '<label class="tg-field"><span class="tg-field__label">'+label+(opts.req?'<span class="tg-field__req">*</span>':'')+'</span><span class="tg-input'+(opts.disabled?' is-disabled':'')+'">'+(opts.prefix?'<span>'+opts.prefix+'</span>':'')+'<input id="'+id+'" value="'+(val||'')+'" placeholder="'+(opts.ph||'')+'" '+(opts.disabled?'disabled':'')+'></span></label>'}function render(){var d=state.draft,t=total(),links=state.links;var hist=[{kind:'dot',html:'<strong>Flávia</strong> alterou o responsável para Flávia',at:'23/07/2026 17:18'},{kind:'flag',html:'<strong>Negociação criada</strong>',at:'23/07/2026 17:15'}];links.forEach(function(l){hist.unshift({kind:'dot',html:'<strong>'+DEAL.owner+'</strong> criou o link '+l.name,at:l.created.toLocaleString('pt-BR')})});var payBody=links.length?'<ul class="pay-list">'+links.map(function(l){return '<li><button class="pay-row" data-act="open" data-id="'+l.id+'"><time>'+l.created.toLocaleString('pt-BR')+'</time><span class="pay-pill">'+icon('link',16)+' Aguardando pagamento</span></button></li>'}).join('')+'</ul>':'<p class="pay-empty">Não há links de pagamentos na negociação, clique no botão abaixo para criar um link</p>';var funnel=['past','past','current','next','next','next'].map(function(tone,i){return '<li class="funnel-step funnel-step--'+tone+(i===0?' is-first':'')+(i===5?' is-last':'')+'">'+(i>0?'<span class="funnel-step__tale"></span>':'')+'<span class="funnel-step__info"><strong>Etapa</strong> <span>(0 dias)</span></span>'+(i<5?'<span class="funnel-step__nose"></span>':'')+'</li>'}).join('');var tabs=['Histórico','Email','Tarefas','Questionário','Produtos e serviços','Proposta','Arquivos'];var items='';if(d.specify){items='<section><div class="items-head"><h3>Produtos e serviços do link</h3>'+btn('tertiary','Adicionar novo item',{icon:'add',act:'add-item'})+'</div>'+d.items.map(function(i){return '<article class="item-card"><div class="item-card__fields">'+field('Nome','n-'+i.id,i.name,{req:true,ph:'Insira o nome do item'})+'<div class="item-card__row">'+field('Preço unitário','p-'+i.id,fmtIn(i.unit),{req:true,prefix:'R$',ph:'00,00'})+'<label class="tg-field"><span class="tg-field__label">Quantidade<span class="tg-field__req">*</span></span><span class="tg-input"><select id="q-'+i.id+'">'+Array.from({length:20},function(_,k){return '<option '+(i.qty===k+1?'selected':'')+'>'+(k+1)+'</option>'}).join('')+'</select></span></label></div></div>'+btn('neutral','',{icon:'delete',iconOnly:true,act:'del-item',id:i.id,disabled:d.items.length===1,aria:'Excluir item'})+'</article>'}).join('')+'</section>';}var create='<div class="drawer-body"><div class="drawer-form">'+field('Nome','name',d.name,{req:true})+field('Descrição','desc',d.description,{req:true,ph:'Insira a descrição do pagamento'})+'<div>'+field('Valor total','val',d.specify?fmtIn(t):fmtIn(d.total),{req:true,prefix:d.specify?'':'R$',ph:d.specify?'Cadastre os itens para obter a soma total':'00,00',disabled:d.specify})+'<div style="margin-top:8px"><button class="tg-switch'+(d.specify?' is-on':'')+'" data-act="toggle" role="switch"><span class="tg-switch__track"></span>Especificar itens</button></div></div>'+items+'</div><div class="total-bar"><strong>Total</strong><span>'+fmt(t)+'</span>'+icon('expand_less')+'</div></div><footer class="drawer-actions"><div class="tg-group">'+btn('secondary','Cancelar',{act:'close'})+btn('primary','Criar link',{act:'create',disabled:!canCreate()})+'</div></footer>';var a=state.active;var ready=a?('<div class="drawer-body"><div class="ready-stack"><aside class="tg-message"><div class="tg-message__body">'+icon('info')+'<div><p class="tg-message__title">Configurações de pagamento</p><p>Métodos de pagamento aceitos, validade do link e número de parcelas são determinados por Administradores na TOTVSPay.</p></div></div></aside><section class="ready-card"><h3 class="ready-title">'+icon('check_circle')+' Link de pagamento pronto!</h3><div><strong>Nome</strong><p>'+a.name+'</p></div><div><strong>Descrição</strong><p style="color:#405466">'+a.description+'</p></div><div class="ready-grid"><div><strong>Valor total</strong><p>'+fmt(a.total)+'</p></div><div><strong>Data de criação</strong><p>'+a.created.toLocaleDateString('pt-BR')+'</p></div><div><strong>Data de expiração</strong><p>'+a.expires.toLocaleDateString('pt-BR')+'</p></div></div><div class="ready-link">'+field('Link','url',a.url,{disabled:true})+btn('secondary','',{icon:'content_copy',iconOnly:true,act:'copy',aria:'Copiar link'})+'</div><div class="ready-items"><strong>Itens no link</strong>'+a.items.map(function(i){return '<div class="ready-item"><span>'+i.name+'</span><span>'+i.qty+'x '+fmt(i.unit)+'</span></div>'}).join('')+'</div></section></div></div><footer class="drawer-actions"><div class="tg-group">'+btn('secondary','Fechar',{act:'close'})+btn('primary','Copiar link',{act:'copy'})+'</div></footer>'):'';var drawer=state.drawer==='closed'?'':'<button class="drawer-scrim" data-act="close" aria-label="Fechar"></button><aside class="drawer" role="dialog"><header class="drawer-header"><h2>Link de pagamento</h2>'+btn('neutral','',{icon:'close',iconOnly:true,act:'close',aria:'Fechar'})+'</header>'+(state.drawer==='create'?create:ready)+'</aside>';document.getElementById('app').innerHTML='<div class="deal"><header class="deal-header"><div class="deal-header__main">'+btn('neutral','',{icon:'arrow_back',iconOnly:true,aria:'Voltar'})+'<h1 class="deal-header__title">'+DEAL.name+'</h1><div class="tg-group">'+btn('neutral','',{icon:'more_vert',iconOnly:true,aria:'Mais ações'})+btn('secondary','Marcar perda',{icon:'thumb_down'})+btn('primary','Marcar venda',{icon:'thumb_up'})+'</div></div><div class="deal-tags"><span class="deal-tag deal-tag--cyan">EM ANDAMENTO</span><span class="deal-tag">FECHAMENTO E FEEDBACK</span><span class="deal-tag deal-tag--cyan">VENDA CERTA!</span></div></header><ol class="funnel">'+funnel+'</ol><div class="deal-grid"><div class="deal-aside"><aside class="deal-panel">'+['Negociação','Contatos','Empresa','Responsável'].map(function(n){return '<section class="deal-acc"><div class="deal-acc__head"><span class="deal-acc__title">'+n+'</span>'+icon('expand_more')+'</div></section>'}).join('')+'</aside><section class="pay-block"><div class="deal-acc__head"><h2 class="deal-acc__title">Pagamentos</h2>'+icon('expand_less')+'</div>'+payBody+btn('secondary','Criar link de pagamento',{icon:'add',act:'open-create'})+'</section></div><section><div class="deal-tabs">'+tabs.map(function(n){return '<button class="deal-tab'+(state.tab===n?' is-active':'')+'" data-tab="'+n+'">'+n+'</button>'}).join('')+'</div><div class="deal-toolbar"><div class="deal-filters"><label class="deal-filter">Do<span class="tg-input"><select><option>RD Station CRM</option></select></span></label><label class="deal-filter">Exibir<span class="tg-input"><select><option>Todos os eventos</option></select></span></label></div>'+btn('secondary','Criar anotação',{icon:'add'})+'</div><div>'+hist.map(function(e,i){return '<article class="timeline-item"><div class="timeline-rail">'+(e.kind==='flag'?'<span class="timeline-flag">'+icon('flag',24)+'</span>':'<span class="timeline-dot"></span>')+(i<hist.length-1?'<span class="timeline-line"></span>':'')+'</div><div class="timeline-content"><p>'+e.html+'</p><time>'+e.at+'</time></div></article>'}).join('')+'</div></section></div>'+drawer+(state.toast?'<div class="toast">'+state.toast+'</div>':'')+'</div>';bind();}function bind(){document.querySelectorAll('[data-act]').forEach(function(el){el.onclick=function(){act(el.dataset.act,el.dataset.id)}});document.querySelectorAll('[data-tab]').forEach(function(el){el.onclick=function(){state.tab=el.dataset.tab;render()}});var name=document.getElementById('name'); if(name) name.oninput=function(e){state.draft.name=e.target.value;refreshCreate()};var desc=document.getElementById('desc'); if(desc) desc.oninput=function(e){state.draft.description=e.target.value;refreshCreate()};var val=document.getElementById('val'); if(val&&!state.draft.specify) val.oninput=function(e){state.draft.total=parse(e.target.value);refreshCreate()};state.draft.items.forEach(function(i){var n=document.getElementById('n-'+i.id); if(n) n.oninput=function(e){i.name=e.target.value;refreshCreate()};var p=document.getElementById('p-'+i.id); if(p) p.oninput=function(e){i.unit=parse(e.target.value);refreshCreate()};var q=document.getElementById('q-'+i.id); if(q) q.onchange=function(e){i.qty=Number(e.target.value);render()}});}function refreshCreate(){var b=document.querySelector('[data-act=create]'); if(b) b.disabled=!canC
